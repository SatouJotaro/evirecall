# Ready-to-enable template. Copy to .github/workflows/ci.yml with workflow permission.
name: Offline setup

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      # Action versions follow their official usage documentation.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m evirecall doctor
      - run: python -m unittest discover -s tests -v
      - run: python -m evirecall smoke --output runs/ci-smoke
