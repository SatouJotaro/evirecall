[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evirecall"
version = "0.1.0"
description = "Evidence-aware memory experiments: shared contracts and offline setup"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evirecall = "evirecall.cli:main"

[tool.setuptools.packages.find]
include = ["evirecall*"]
